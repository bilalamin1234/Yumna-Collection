<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — Yumna Collection</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="responsive.css">
<script src="script.js" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

<div class="auth-page">
  <div class="auth-card">
    <a href="index.html" class="auth-back">&larr; Back to shop</a>

    <div class="auth-brand">
      <a href="index.html" class="brand-mark">Yumna <em>&amp;</em> Collection</a>
    </div>

    <div class="auth-tabs" role="tablist">
      <button type="button" class="is-active" id="tabSignIn" role="tab" aria-selected="true">Sign In</button>
      <button type="button" id="tabSignUp" role="tab" aria-selected="false">Create Account</button>
    </div>

    <!-- SIGN IN FORM -->
    <form class="auth-form is-active" id="signInForm" novalidate>
      <div class="auth-field">
        <label for="signInEmail">Email</label>
        <input type="email" id="signInEmail" autocomplete="email" required>
      </div>
      <div class="auth-field">
        <label for="signInPassword">Password</label>
        <input type="password" id="signInPassword" autocomplete="current-password" required>
      </div>
      <p class="auth-error" id="signInError"></p>
      <button type="submit" class="btn btn-primary auth-submit">Sign in</button>
    </form>

    <!-- CREATE ACCOUNT FORM -->
    <form class="auth-form" id="signUpForm" novalidate>
      <div class="auth-field">
        <label for="signUpName">Full name</label>
        <input type="text" id="signUpName" autocomplete="name" required>
      </div>
      <div class="auth-field">
        <label for="signUpEmail">Email</label>
        <input type="email" id="signUpEmail" autocomplete="email" required>
      </div>
      <div class="auth-field">
        <label for="signUpPassword">Password</label>
        <input type="password" id="signUpPassword" autocomplete="new-password" required minlength="8">
      </div>
      <div class="auth-field">
        <label for="signUpConfirm">Confirm password</label>
        <input type="password" id="signUpConfirm" autocomplete="new-password" required minlength="8">
      </div>
      <p class="auth-error" id="signUpError"></p>
      <button type="submit" class="btn btn-primary auth-submit">Create account</button>
    </form>

    <p class="auth-foot" id="authFoot">New here? <a href="#" id="switchToSignUp">Create an account</a></p>
  </div>
</div>
</body>
</html>
